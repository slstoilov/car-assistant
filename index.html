<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Assistant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774083.png">
<style>
body{font-family:system-ui;background:#0f172a;color:white;margin:0;padding:20px;text-align:center}
.card{background:#1e293b;padding:20px;border-radius:16px;margin:20px auto;max-width:400px}
button{background:#3b82f6;color:white;border:0;padding:12px 20px;border-radius:10px;font-size:16px;width:100%;margin-top:10px}
input{width:100%;padding:10px;border-radius:8px;border:0;margin:6px 0;box-sizing:border-box}
</style>
</head>
<body>
<h1>🚗 Car Assistant</h1>
<p>Твоят асистент за кола е активен!</p>
<div class="card">
<h3>Добави разход</h3>
<input placeholder="Километри" type="number">
<input placeholder="Литри / Сума лв">
<button onclick="alert('Запазено!')">Запази</button>
</div>
<div class="card">
<p>Сайтът е PWA готов и може да стане APK!</p>
<button onclick="alert('Инсталирай от менюто ⋮ -> Install')">Инсталирай като приложение</button>
</div>
<script>
if('serviceWorker' in navigator){
  // minimal sw
  navigator.serviceWorker.register('data:text/javascript,console.log("sw")').catch(()=>{});
}
</script>
</body>
</html>
