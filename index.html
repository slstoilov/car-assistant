<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Assistant</title>
<link rel="manifest" href="/car-assistant/manifest.json">
<meta name="theme-color" content="#0ea5e9">
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:400px;width:100%}
.card{background:#1e293b;border-radius:16px;padding:12px;text-align:center}
.main-icon img{width:120px;height:120px;border-radius:24px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.main-icon{margin:20px 0}
</style>
</head>
<body>
<h1>Car Assistant - Petev</h1>
<div class="main-icon"><img src="assets/icon-512.png" alt="icon"></div>
<p>Финална икона - близнаци 1:1, без стърчане върху синьото</p>
<div class="grid">
<div class="card">🚗<br>Кола</div>
<div class="card">📄<br>Документи</div>
<div class="card">🚓<br>Глоби</div>
<div class="card">🛡️<br>Застраховка</div>
<div class="card">🔧<br>ГТП</div>
<div class="card">🛢️<br>Масло</div>
<div class="card">🛣️<br>Винетка</div>
<div class="card">⛽<br>Гориво</div>
</div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
